app-id: com.andersonlaverde.slacky
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: slacky
separate-locales: false

finish-args:
  # Electron's zygote/renderer processes talk to each other over the X11 and
  # IPC sockets; without --share=ipc it falls back to slow shared memory.
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  # Huddles: microphone and speakers via PulseAudio, GPU acceleration and the
  # webcam via --device=all. Screen sharing goes through the portal, which is
  # available to every sandbox by default.
  #
  # --device=all is broader than --device=dri and a Flathub reviewer may ask
  # about it. It is here because Chromium reaches /dev/video* directly for
  # getUserMedia rather than going through the camera portal; narrow this to
  # --device=dri if huddle video ever works without it.
  - --socket=pulseaudio
  - --device=all
  # Desktop notifications and the tray icon.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # File uploads and downloads land in the usual places.
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures:ro

modules:
  # TEMPORARY: this should be `sdk-extensions: [org.freedesktop.Sdk.Extension.node24]`
  # with `append-path: /usr/lib/sdk/node24/bin` on the module below.
  # dl.flathub.org is serving that extension's aarch64/24.08 objects broken
  # (HTTP 503, or a 22 MB object truncated at exactly 3 MiB), so Node comes
  # from nodejs.org instead. Revert to the SDK extension once that is fixed.
  #
  # `cleanup: ['*']` drops everything this module installs from the finished
  # flatpak: Node is needed to build, not to run.
  - name: node
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - cp -a bin include lib share /app/
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-arm64.tar.xz
        sha256: 01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc
        only-arches:
          - aarch64

  - name: slacky
    buildsystem: simple
    build-options:
      append-path: /app/bin
      env:
        # The build sandbox has no network. Both caches are pre-populated by
        # the sources in generated-sources.json; electron-builder finds the
        # Electron binaries it needs under XDG_CACHE_HOME.
        # (The directory format is /run/build/MODULE_NAME/flatpak-node/...)
        XDG_CACHE_HOME: /run/build/slacky/flatpak-node/cache
        npm_config_cache: /run/build/slacky/flatpak-node/npm-cache
    build-commands:
      - npm install --offline
      - npm run build
      # `--linux dir` produces an unpacked tree and nothing else. Do NOT use
      # electron-builder's own `flatpak` target here: it shells out to
      # flatpak-builder, and running flatpak-builder inside a flatpak build is
      # what wedged the original attempt at this manifest.
      #
      # The arch args generated by flatpak-node-generator have to be sourced in
      # the same command that uses them: each build-command gets its own shell.
      - . flatpak-node/electron-builder-arch-args.sh; ./node_modules/.bin/electron-builder --linux dir $ELECTRON_BUILDER_ARCH_ARGS
      - mkdir -p /app/main
      - cp -a dist/packages/linux*unpacked/. /app/main/
      # zypak lets Electron's sandbox work inside flatpak's own sandbox.
      - install -Dm755 flatpak/slacky.sh /app/bin/slacky
      - install -Dm644 build/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.andersonlaverde.slacky.png
      - install -Dm644 flatpak/com.andersonlaverde.slacky.desktop /app/share/applications/com.andersonlaverde.slacky.desktop
      - install -Dm644 flatpak/com.andersonlaverde.slacky.metainfo.xml /app/share/metainfo/com.andersonlaverde.slacky.metainfo.xml
    sources:
      - type: git
        url: https://github.com/andirsun/Slacky.git
        tag: v1.0.0
        # Keep this commit in sync with the tag above; Flathub requires both.
        commit: c0dbd8fe2dd6602574f501454e518f17d1236a92
      # Generated by flatpak-node-generator, see flatpak/README.md.
      - generated-sources.json
