appId: com.andersonlaverde.slacky
productName: Slacky
copyright: Copyright © 2024 Anderson Laverde
## Pack the app in the read-only Electron format https://github.com/electron/asar
asar: true
# artifactName: ${productName}.${ext}
directories:
  output: dist/packages
files:
  - package.json
  - dist/app/**/*
  - node_modules
  # Read at runtime for the tray and window icon. The desktop entry gets
  # its own copy of build/icons, outside the asar.
  - build/icons/icon.png
protocols:
  - name: electron-deep-linking
    schemes:
      - slack
linux:
  category: Network
  synopsis: Slack client for Linux arm64 systems
  target:
    - target: AppImage
      arch:
        - arm64
    - target: rpm
      arch:
        - arm64
    - target: deb
      arch:
        - arm64
publish:
  - provider: github
    releaseType: release